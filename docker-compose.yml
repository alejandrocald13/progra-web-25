version: '3.8'

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/tradio_app
      SONAR_JDBC_USERNAME: alejandro
      SONAR_JDBC_PASSWORD: root
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - sonar-net

  db:
    image: postgres:13
    container_name: sonar-db
    environment:
      POSTGRES_USER: alejandro
      POSTGRES_PASSWORD: root
      POSTGRES_DB: tradio_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sonar-net

networks:
  sonar-net:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgres_data:
